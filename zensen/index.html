<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ZENSEN 前線</title>
<meta name="description" content="読んで、溜めて、押し上げる。先読み・記憶・我慢・切り替えを使う、1 局 5 分の戦略ボードゲーム">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0C1016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="前線">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
/* 書体は届けば使う。届かなければ端末の明朝・ゴシックに落ちるだけ */
:root {
  color-scheme: dark;
  --bg: #0C1016; --bg2: #111720; --panel: #171E29; --panel2: #1D2633; --line: #283344; --line2: #1E2734;
  --ink: #ECE9E1; --ink2: #A6AEBB; --ink3: #6E7888;
  --me: #5BB9E2; --me-soft: rgba(91,185,226,.16); --me-deep: #17425C;
  --foe: #EC5B43; --foe-soft: rgba(236,91,67,.16); --foe-deep: #5F1E17;
  --gold: #E8C56D; --amber: #F4B23F; --amber-deep: #7A5210; --ok: #5CC792; --bad: #F0624F;
  --board: #18212D; --board2: #1C2634;
  --f-ui: "Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --f-min: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --appw: min(100vw, 480px);
  --cell: min(calc((var(--appw) - 20px) / 5), calc((100dvh - 282px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) / 7), 80px);
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--f-ui); overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
[hidden] { display: none !important; }
#app { position: relative; width: var(--appw); height: 100dvh; margin: 0 auto; overflow: hidden;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.scr { position: absolute; inset: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); display: flex; flex-direction: column; animation: scr-in .28s ease both; }
@keyframes scr-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.min { font-family: var(--f-min); font-weight: 900; }

/* ---------- 共通部品 ---------- */
.bar { flex: none; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 6px; }
.bar h2 { flex: 1; margin: 0; font-size: 16px; font-weight: 700; text-align: center; letter-spacing: .08em; }
.icb { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink2); font-size: 20px; }
.icb:active { background: var(--panel2); }
.icb svg { width: 22px; height: 22px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: 14px;
  background: var(--panel2); border: 1px solid var(--line); font-weight: 700; font-size: 16px; letter-spacing: .06em; transition: transform .08s, filter .15s; }
.btn:active { transform: scale(.97); filter: brightness(1.15); }
.btn.pri { background: linear-gradient(180deg, #F1CF7C, #D9A945); color: #2A1C04; border-color: #F6DC97; box-shadow: 0 6px 20px rgba(232,197,109,.22), inset 0 1px 0 rgba(255,255,255,.5); }
.btn.sm { min-height: 40px; font-size: 14px; padding: 0 14px; border-radius: 11px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--panel2); border: 1px solid var(--line); font-size: 12px; color: var(--ink2); }
.card-box { background: var(--panel); border: 1px solid var(--line2); border-radius: 16px; }
.muted { color: var(--ink2); } .dim { color: var(--ink3); }
.sw { position: relative; width: 46px; height: 28px; border-radius: 14px; background: var(--line); flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw.on { background: var(--ok); } .sw.on::after { transform: translateX(18px); }
.seg { display: flex; background: var(--bg2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { flex: 1; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
.seg button.on { background: var(--panel2); color: var(--ink); box-shadow: 0 0 0 1px var(--line); font-weight: 700; }

/* ---------- ホーム ---------- */
#scr-home { padding: 0 20px 18px; background:
  radial-gradient(120% 60% at 50% 0%, rgba(91,185,226,.10), transparent 60%),
  radial-gradient(120% 60% at 50% 100%, rgba(236,91,67,.10), transparent 60%); }
.home-art { position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(var(--line2) 1px, transparent 1px), linear-gradient(90deg, var(--line2) 1px, transparent 1px);
  background-size: 20% 64px; background-position: 0 0; -webkit-mask-image: radial-gradient(80% 50% at 50% 34%, #000, transparent); mask-image: radial-gradient(80% 50% at 50% 34%, #000, transparent); }
.home-top { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.logo { display: flex; flex-direction: column; align-items: center; }
.logo .k { font-family: var(--f-min); font-weight: 900; font-size: clamp(64px, 22vw, 104px); line-height: 1; letter-spacing: .12em; margin-right: -.12em;
  background: linear-gradient(180deg, #FFF6DE 20%, #E8C56D 60%, #B98A2B); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 24px rgba(232,197,109,.25)); }
.logo .e { margin-top: 10px; font-size: 13px; letter-spacing: .62em; margin-right: -.62em; color: var(--ink2); font-weight: 500; }
.logo .line { width: 180px; height: 2px; margin: 16px 0 12px; background: linear-gradient(90deg, transparent, var(--me), #fff, var(--foe), transparent); border-radius: 2px; }
.logo .tag { font-family: var(--f-min); font-weight: 700; font-size: 15px; letter-spacing: .2em; color: var(--ink); }
.home-stats { display: flex; gap: 8px; margin-top: 22px; }
.home-stats .st { min-width: 86px; padding: 8px 10px; text-align: center; border-radius: 12px; background: rgba(23,30,41,.7); border: 1px solid var(--line2); }
.home-stats .st b { display: block; font-family: var(--f-min); font-size: 20px; color: var(--gold); }
.home-stats .st span { font-size: 11px; color: var(--ink3); letter-spacing: .08em; }
.home-menu { flex: none; display: grid; gap: 10px; position: relative; }
.home-menu .row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.home-menu .btn.pri { min-height: 62px; font-size: 19px; }
.home-menu .btn .s { font-size: 11px; font-weight: 500; opacity: .75; letter-spacing: .04em; }
.btn.col { flex-direction: column; gap: 2px; min-height: 60px; font-size: 14px; }
.resume { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-radius: 14px; background: var(--me-soft); border: 1px solid rgba(91,185,226,.35); font-size: 13px; }
.resume b { flex: 1; font-weight: 500; }
.home-foot { margin-top: 12px; text-align: center; font-size: 11px; color: var(--ink3); }
.home-foot button { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 相手選び ---------- */
.list { flex: 1; min-height: 0; padding: 4px 14px 20px; display: grid; gap: 8px; align-content: start; }
.opp { display: flex; align-items: center; gap: 12px; padding: 10px 12px; text-align: left; width: 100%; }
.opp .ava, .ava { flex: none; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-family: var(--f-min); font-weight: 900; font-size: 24px;
  color: #FFE9D2; background: linear-gradient(160deg, #A2343A, #5E171C); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
.opp .mid { flex: 1; min-width: 0; }
.opp .nm { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.opp .nm small { font-weight: 500; font-size: 11px; color: var(--ink3); letter-spacing: .06em; }
.opp .ds { margin-top: 2px; font-size: 12px; color: var(--ink2); line-height: 1.45; }
.opp .rec { flex: none; text-align: right; font-size: 11px; color: var(--ink3); line-height: 1.5; }
.opp .rec b { display: block; font-size: 13px; color: var(--gold); font-family: var(--f-min); }
.opp.lock { opacity: .45; }
.opp.next { border-color: rgba(232,197,109,.55); box-shadow: 0 0 0 1px rgba(232,197,109,.25), 0 8px 24px rgba(232,197,109,.08); }
.opp.won .ava { background: linear-gradient(160deg, #3A4658, #232C3A); color: var(--ink2); }
.setup { padding: 4px 4px 0; display: grid; gap: 4px; }
.setrow { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 6px 0; border-bottom: 1px solid var(--line2); }
.setrow:last-child { border-bottom: 0; }
.setrow .t { flex: 1; font-size: 14px; font-weight: 500; }
.setrow .t small { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 400; color: var(--ink3); line-height: 1.45; }

/* ---------- 対局 ---------- */
#scr-game { background: linear-gradient(180deg, #120E12 0%, var(--bg) 26%, var(--bg) 74%, #0B1218 100%); }
.g-top { flex: none; height: 34px; display: flex; align-items: center; padding: 0 4px; }
.g-top .icb { width: 34px; height: 34px; }
.g-turn { flex: 1; text-align: center; font-size: 12px; color: var(--ink2); letter-spacing: .1em; display: flex; align-items: center; justify-content: center; gap: 8px; }
.g-turn b { color: var(--ink); font-size: 13px; }
.g-turn .ot { padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700; background: var(--amber); color: #2A1C04; letter-spacing: .08em; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.3); } }
.side { flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
.side.foe { height: 58px; }
.side.me { height: 40px; }
.side.foe > .ava { width: 40px; height: 40px; font-size: 21px; border-radius: 12px; }
.who { min-width: 0; flex: 1; display: grid; gap: 5px; }
.who .nmrow { display: flex; align-items: baseline; gap: 8px; min-width: 0; height: 18px; }
.who .nm { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .sub { flex: none; font-size: 11px; color: var(--ink3); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.think { display: inline-flex; gap: 3px; align-items: center; color: var(--foe); font-weight: 700; }
.think i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; animation: think 1s infinite; }
.think i:nth-child(2) { animation-delay: .15s; } .think i:nth-child(3) { animation-delay: .3s; }
@keyframes think { 0%, 60%, 100% { opacity: .25; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
.breach { display: flex; gap: 5px; align-items: center; }
.breach i { width: 13px; height: 13px; transform: rotate(45deg); border-radius: 3px; border: 1.5px solid var(--ink3); background: transparent; transition: all .3s; }
.breach.me i.on { background: var(--me); border-color: #BFE7FA; box-shadow: 0 0 10px var(--me); }
.breach.foe i.on { background: var(--foe); border-color: #FFC2B5; box-shadow: 0 0 10px var(--foe); }
.breach i.pop { animation: pip-pop .6s ease; }
@keyframes pip-pop { 0% { transform: rotate(45deg) scale(1); } 40% { transform: rotate(45deg) scale(2.1); } 100% { transform: rotate(45deg) scale(1); } }
.breach-lbl { font-size: 10px; color: var(--ink3); letter-spacing: .1em; margin-right: 2px; }
.energy { display: flex; align-items: center; gap: 6px; }
.energy .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #2A1C04;
  background: radial-gradient(circle at 35% 30%, #FFE9A8, var(--amber) 60%, #C98718); box-shadow: 0 0 12px rgba(244,178,63,.45); flex: none; }
.energy .pips { display: flex; gap: 3px; flex: 1; }
.energy .pips i { flex: 1; height: 12px; min-width: 9px; border-radius: 3px; background: #232C39; box-shadow: inset 0 0 0 1px #2D394A; transition: background .25s, box-shadow .25s; }
.energy .pips i.on { background: linear-gradient(180deg, #FFDC85, var(--amber)); box-shadow: 0 0 8px rgba(244,178,63,.5); }
.energy .pips i.gain { animation: gain .5s ease; }
.energy .pips i.need { background: repeating-linear-gradient(45deg, #5a4a1f 0 3px, #2D394A 3px 6px); }
@keyframes gain { 0% { transform: scaleY(2.2); filter: brightness(2); } 100% { transform: none; } }
.energy.sm .num { width: 20px; height: 20px; font-size: 11.5px; }
.energy.sm .pips i { height: 7px; min-width: 6px; border-radius: 2px; }
.foe-meters { display: flex; gap: 10px; align-items: center; }
.foe-meters .energy { flex: 1; max-width: 120px; }
.foe-meters .breach i { width: 11px; height: 11px; }
.side.me .energy { flex: 1; }
.passbtn { flex: none; height: 34px; padding: 0 14px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; font-weight: 700; letter-spacing: .1em; display: flex; align-items: center; gap: 6px; }
.passbtn:active { filter: brightness(1.3); }
.passbtn[disabled] { opacity: .35; pointer-events: none; }
.passbtn small { color: var(--amber); font-weight: 700; }

/* 手札 */
.hand { flex: none; display: flex; gap: 6px; padding: 6px 10px 8px; align-items: stretch; height: 98px; }
.hc { position: relative; flex: 1; border-radius: 12px; background: linear-gradient(180deg, #FBF4E4, #E9DDC3); color: #1A2433; display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 3px 0 #B9AA88, 0 6px 14px rgba(0,0,0,.4); transition: transform .14s cubic-bezier(.3,1.4,.5,1), filter .15s, box-shadow .15s; }
.hc .kj { font-family: var(--f-min); font-weight: 900; font-size: 34px; line-height: 1; margin-top: 4px; }
.hc .nmx { font-size: 10.5px; font-weight: 700; color: #6B6250; margin-top: 3px; letter-spacing: .08em; }
.hc .cost { position: absolute; top: -5px; left: -4px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #2A1C04;
  background: radial-gradient(circle at 35% 30%, #FFE9A8, var(--amber) 60%, #C98718); box-shadow: 0 2px 6px rgba(0,0,0,.45), 0 0 0 2px var(--bg); }
.hc.spell { background: linear-gradient(180deg, #2B2450, #171331); color: #FFE58A; box-shadow: 0 3px 0 #0E0B22, 0 6px 14px rgba(0,0,0,.4), inset 0 0 0 1px #5B4FB0; }
.hc.spell .nmx { color: #B5ABEA; }
.hc.off { filter: saturate(.3) brightness(.55); }
.hc.sel { transform: translateY(-12px); box-shadow: 0 3px 0 #B9AA88, 0 0 0 2.5px var(--gold), 0 14px 26px rgba(232,197,109,.35); }
.hc.spell.sel { box-shadow: 0 3px 0 #0E0B22, 0 0 0 2.5px var(--gold), 0 14px 26px rgba(232,197,109,.35); }
.hc.in { animation: card-in .35s cubic-bezier(.3,1.3,.5,1); }
@keyframes card-in { from { transform: translateX(40px) scale(.7); opacity: 0; } }
.hc.shake { animation: shake .3s; }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
.nextc { flex: none; width: 48px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; }
.nextc span { font-size: 10px; color: var(--ink3); letter-spacing: .12em; }
.nextc .hc { flex: none; width: 44px; height: 56px; border-radius: 9px; filter: brightness(.8); box-shadow: 0 2px 0 #B9AA88; }
.nextc .hc .kj { font-size: 20px; margin: 0; }
.nextc .hc .cost { width: 18px; height: 18px; font-size: 10.5px; top: -5px; left: -5px; }
.fhand { display: flex; gap: 4px; flex: none; align-items: center; }
.fc { position: relative; width: 30px; height: 38px; border-radius: 7px; background: linear-gradient(180deg, #9A3036, #6A1B20); color: #FFE9D2; display: grid; place-items: center; font-family: var(--f-min); font-weight: 900; font-size: 17px; box-shadow: 0 2px 0 #3E0F12; }
.fc.spell { background: linear-gradient(180deg, #2B2450, #171331); color: #FFE58A; box-shadow: 0 2px 0 #0E0B22, inset 0 0 0 1px #5B4FB0; }
.fc .cost { position: absolute; top: -4px; left: -4px; width: 14px; height: 14px; border-radius: 50%; background: var(--amber); color: #2A1C04; font: 700 9px/14px var(--f-ui); text-align: center; box-shadow: 0 0 0 1.5px var(--bg); }
.fc.off { filter: brightness(.6) saturate(.6); }
.fc.back { background: repeating-linear-gradient(45deg, #2A3444 0 4px, #222B38 4px 8px); color: var(--ink3); box-shadow: 0 2px 0 #151B24; font-family: var(--f-ui); font-size: 13px; }
.fc.nx { transform: scale(.8); opacity: .7; margin-left: 2px; }
.fc.in { animation: card-in .35s; }
.fc.used { animation: fc-used .5s; }
@keyframes fc-used { 30% { transform: translateY(10px) scale(1.25); filter: brightness(1.6); } }

/* 盤 */
.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
.board { position: relative; width: calc(var(--cell) * 5); height: calc(var(--cell) * 7); border-radius: 10px;
  background: var(--board); box-shadow: 0 0 0 1px #2B3748, 0 0 0 5px #121922, 0 0 0 6px #2B3748, 0 18px 50px rgba(0,0,0,.55); }
.board.shake { animation: bshake .35s; }
@keyframes bshake { 15% { transform: translate(-4px, 2px); } 30% { transform: translate(4px, -3px); } 45% { transform: translate(-3px, -2px); } 60% { transform: translate(3px, 2px); } 80% { transform: translate(-1px, 1px); } }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(7, 1fr); border-radius: 10px; overflow: hidden; }
.cell { position: relative; box-shadow: inset 0 0 0 .5px #2A3545; }
.cell.alt { background: var(--board2); }
.cell.hm { background-image: linear-gradient(rgba(91,185,226,.075), rgba(91,185,226,.075)); }
.cell.hf { background-image: linear-gradient(rgba(236,91,67,.075), rgba(236,91,67,.075)); }
.cell.gm::after, .cell.gf::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; }
.cell.gf::after { top: 0; background: repeating-linear-gradient(90deg, rgba(91,185,226,.9) 0 6px, transparent 6px 10px); }
.cell.gm::after { bottom: 0; background: repeating-linear-gradient(90deg, rgba(236,91,67,.9) 0 6px, transparent 6px 10px); }
.cell .m { position: absolute; inset: 0; pointer-events: none; }
.cell .cx, .cell .cy { position: absolute; font-size: 9px; line-height: 1; color: var(--ink3); opacity: .7; pointer-events: none; }
.cell .cy { left: 3px; top: 3px; } .cell .cx { right: 4px; bottom: 5px; }
.cell.last .m { background: rgba(232,197,109,.13); box-shadow: inset 0 0 0 1.5px rgba(232,197,109,.35); }
.cell.sel .m { background: rgba(232,197,109,.22); box-shadow: inset 0 0 0 2px var(--gold); }
.cell.t-move .m::before { content: ""; position: absolute; left: 50%; top: 50%; width: 26%; height: 26%; margin: -13% 0 0 -13%; border-radius: 50%; background: var(--me); opacity: .85; box-shadow: 0 0 12px var(--me); animation: dot-in .18s ease both; }
.cell.t-cap .m { box-shadow: inset 0 0 0 3px var(--bad); background: rgba(240,98,79,.22); animation: cap-pulse 1s ease-in-out infinite; }
.cell.t-dep .m { background: rgba(92,199,146,.16); box-shadow: inset 0 0 0 1.5px rgba(92,199,146,.6); animation: dot-in .18s ease both; }
.cell.t-dep .m::before { content: ""; position: absolute; left: 50%; top: 50%; width: 14%; height: 14%; margin: -7% 0 0 -7%; border-radius: 50%; background: var(--ok); }
.cell.t-foe .m { background: rgba(236,91,67,.2); box-shadow: inset 0 0 0 1.5px rgba(236,91,67,.55); }
.cell.t-foe .m::before { content: ""; position: absolute; left: 50%; top: 50%; width: 18%; height: 18%; margin: -9% 0 0 -9%; border-radius: 50%; background: var(--foe); opacity: .8; }
.cell.t-foedep .m { background: repeating-linear-gradient(45deg, rgba(236,91,67,.13) 0 5px, transparent 5px 10px); }
.cell.chk .m { box-shadow: inset 0 0 0 3px var(--bad), inset 0 0 22px rgba(240,98,79,.6); animation: cap-pulse .8s ease-in-out infinite; }
.cell.brk .m { box-shadow: inset 0 0 0 3px var(--amber), inset 0 0 22px rgba(244,178,63,.55); animation: cap-pulse .8s ease-in-out infinite; }
