<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仮説ドリル</title>
<meta name="description" content="事業責任者の視座で、仮説生成・因果分解・検証設計を90秒×3種目で鍛えるトレーニング">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121511" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="仮説ドリル">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600&display=swap">
<style>
  /* 書体は届けば使う。届かなければ端末の書体に落ちるだけで、動作は変わらない */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<style>
  :root {
    color-scheme: light;
    --ground:  #F1F3EE;
    --surface: #FBFBF8;
    --raised:  #FFFFFF;
    --line:    #DCDFD6;
    --line2:   #EAECE4;
    --ink:     #161A16;
    --ink2:    #4E544C;
    --ink3:    #7C8379;
    --accent:  #0F6F45;
    --accent2: #0B5636;
    --onaccent:#FFFFFF;
    --accentsoft: #E2EDE6;
    --alert:   #B3301C;
    --alertsoft: #F8E7E3;
    --s1: #2A78D6;
    --s2: #EB6834;
    --s3: #1BAF7A;
    --grid: #E3E6DD;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:  #121511;
      --surface: #191D18;
      --raised:  #1F241E;
      --line:    #2F352F;
      --line2:   #242A25;
      --ink:     #E9EDE4;
      --ink2:    #A7AFA3;
      --ink3:    #79817A;
      --accent:  #47BB86;
      --accent2: #6BD0A1;
      --onaccent:#07160E;
      --accentsoft: #16291F;
      --alert:   #F06A4E;
      --alertsoft: #2B1712;
      --s1: #3987E5;
      --s2: #D95926;
      --s3: #199E70;
      --grid: #272D27;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:  #121511;
    --surface: #191D18;
    --raised:  #1F241E;
    --line:    #2F352F;
    --line2:   #242A25;
    --ink:     #E9EDE4;
    --ink2:    #A7AFA3;
    --ink3:    #79817A;
    --accent:  #47BB86;
    --accent2: #6BD0A1;
    --onaccent:#07160E;
    --accentsoft: #16291F;
    --alert:   #F06A4E;
    --alertsoft: #2B1712;
    --s1: #3987E5;
    --s2: #D95926;
    --s3: #199E70;
    --grid: #272D27;
  }

  html, body { background: var(--ground); }
  body {
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    /* 端末アプリと同じ当たり: タップの灰色、ダブルタップ拡大、長押し選択を止める */
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button, .chrome { -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }

  /* ノッチとホームバーを避ける。ブラウザ内では 0 になるので実害がない */
  .safe-t { padding-top: env(safe-area-inset-top, 0px); }
  .safe-b { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
  .safe-page { padding-bottom: calc(3.5rem + env(safe-area-inset-bottom, 0px)); }
  /* Fallback framing before Tailwind's runtime stylesheet arrives. */
  #root { max-width: 42rem; margin: 0 auto; }

  .num { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .case { font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif; }
  .eyebrow { letter-spacing: .14em; }

  /* The practice stage tracks the VISUAL viewport so the soft keyboard
     never covers the field being typed into. */
  .stage {
    position: fixed; left: 0; right: 0;
    top: var(--vv-top, 0px);
    height: var(--vv-h, 100dvh);
    display: flex; flex-direction: column;
    background: var(--ground);
    z-index: 10;
  }
  body.is-running { overflow: hidden; }

  .rail { height: 3px; background: var(--line2); overflow: hidden; }
  .rail > i { display: block; height: 100%; background: var(--accent); transition: width .12s linear; }
  .rail.low > i { background: var(--alert); }

  input, textarea { font-size: 16px; } /* keeps iOS from zooming on focus */
  input::placeholder, textarea::placeholder { color: var(--ink3); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 入力欄は枠線そのものが状態を示すので、二重の輪郭を出さない */
  input:focus-visible, textarea:focus-visible { outline: none; }
  .lines::-webkit-scrollbar { width: 6px; }
  .lines::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  .recharts-surface { overflow: visible; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

            }))),
        E('div', 'safe-b border-t border-line bg-surface px-4 pt-3',
          E('div', 'mb-2 rounded-md bg-ground px-3 py-2',
            E('p', 'text-xs leading-snug text-ink2', quoted)),
          E('div', 'flex items-center gap-2.5',
            E('span', 'num w-5 shrink-0 text-right text-sm font-medium text-accent', 'W' + (stage + 1)),
            E('input', {
              ref: inputRef, id: 'drill-input', type: 'text', value: draft, disabled: locked,
              autoComplete: 'off', autoCorrect: 'off', autoCapitalize: 'off', spellCheck: false,
              enterKeyHint: stage >= 4 ? 'done' : 'next',
              onChange: function (e) { setDraft(e.target.value); },
              onKeyDown: function (e) { if (e.key === 'Enter') { e.preventDefault(); commitWhy(); } },
              className: 'w-full border-0 border-b border-line bg-transparent pb-1.5 text-ink outline-none focus:border-accent',
            }))));
    } else {
      body = E('div', { className: 'lines safe-b min-h-0 flex-1 overflow-y-auto px-4 pt-3', ref: tailRef },
        E('div', 'flex flex-col gap-3',
          pairs.map(function (row, i) {
            return E('div', { key: i, className: 'rounded-lg border border-line bg-surface p-3' },
              E('div', 'num mb-2 text-xs font-medium text-accent', 'SET ' + (i + 1)),
              E('div', 'grid grid-cols-1 gap-2 sm:grid-cols-2',
                [0, 1].map(function (j) {
                  return E('label', { key: j, className: 'block' },
                    E('span', 'mb-1 block text-xs text-ink3', j === 0 ? '仮説' : '検証手段'),
                    E('textarea', {
                      ref: (i === 0 && j === 0) ? inputRef : null,
                      id: 'drill-' + i + '-' + j,
                      rows: 2, value: row[j], disabled: locked,
                      autoComplete: 'off', autoCorrect: 'off', autoCapitalize: 'off', spellCheck: false,
                      onChange: function (e) { setPair(i, j, e.target.value); },
                      onFocus: function (e) {
                        try { e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {}
                      },
                      onKeyDown: function (e) {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          if (i === 2 && j === 1) { finish('early'); return; }
                          var nid = j === 0 ? 'drill-' + i + '-1' : 'drill-' + (i + 1) + '-0';
                          var el = document.getElementById(nid);
                          if (el) el.focus();
                        }
                      },
                      className: 'w-full resize-none rounded-md border border-line bg-ground px-2.5 py-2 leading-snug text-ink outline-none focus:border-accent',
                    }));
                })));
          })));
    }

    return E('div', 'stage',
      E('div', 'mx-auto flex min-h-0 w-full max-w-xl flex-1 flex-col', promptNode, timerNode, body));
  }

  /* ===================================================================
     結果画面 — 改善が先、良かった点は後
     =================================================================== */
  function Meter(p) {
    var v = typeof p.value === 'number' ? p.value : null;
    return E('div', 'flex items-center gap-3',
      E('span', 'w-24 shrink-0 text-xs text-ink2', p.name),
      E('span', 'h-1.5 flex-1 overflow-hidden rounded-full bg-line2',
        E('span', { className: 'block h-full rounded-full bg-accent', style: { width: (v === null ? 0 : v) + '%' } })),
      E('span', 'num w-8 shrink-0 text-right text-xs font-medium text-ink', v === null ? '—' : v));
  }

  function Result(p) {
    var rec = p.rec, M = MODES[rec.mode];
    var fb = rec.feedback;
    var isObj = fb && typeof fb === 'object';

    return E('div', 'safe-page safe-t flex flex-col gap-4 px-4 pt-5',
      E('header', null,
        E('p', 'eyebrow text-xs font-medium uppercase text-ink3', M.mark + ' ' + M.name),
        E('div', 'mt-2 flex items-end gap-3',
          typeof rec.score === 'number'
            ? E('span', 'num text-5xl font-semibold leading-none text-ink', rec.score)
            : E('span', 'text-xl font-bold leading-none text-ink3', p.scoring ? '採点中' : '採点なし'),
          E('span', 'num pb-1 text-xs text-ink3',
            (typeof rec.score === 'number' ? '/ 100 ・ ' : '') + rec.durationSec + '秒 ・ ' + rec.count + (rec.mode === 1 ? '本' : '項目')))),

      p.scoring
        ? E('div', 'rounded-lg border border-line bg-surface px-4 py-3 text-sm text-ink2', '採点中…（記録はすでに保存済みです）')
        : null,

      isObj && fb.axes ? E('section', 'flex flex-col gap-2.5 rounded-lg border border-line bg-surface p-4',
        fb.axes.map(function (a, i) {
          return E('div', { key: i },
            E(Meter, { name: a.name, value: a.score }),
            a.comment ? E('p', 'mt-1 text-xs leading-snug text-ink3', a.comment) : null);
        })) : null,

      /* 改善が先 */
      isObj && (fb.worst.line || fb.worst.rewrite)
        ? E('section', 'rounded-lg border border-line bg-surface p-4',
          E('h3', 'eyebrow mb-2 flex items-center gap-1.5 text-xs font-bold uppercase text-alert',
            E(Icon, { name: 'alert', size: 13 }), '最も弱い1行'),
          fb.worst.line ? E('p', 'mb-3 border-l-2 border-alert pl-3 text-sm leading-snug text-ink2', fb.worst.line) : null,
          fb.worst.rewrite
            ? E('div', null,
              E('p', 'mb-1 text-xs text-ink3', 'こう書き直す'),
              E('p', 'case rounded-md bg-alertsoft px-3 py-2.5 text-sm leading-relaxed text-ink', fb.worst.rewrite))
            : null)
        : null,

      isObj && fb.next
        ? E('section', 'rounded-lg border-2 border-accent bg-accentsoft p-4',
          E('h3', 'eyebrow mb-1.5 text-xs font-bold uppercase text-accent', '次の1手'),
          E('p', 'text-base font-medium leading-snug text-ink', fb.next))
        : null,

      isObj && fb.best.line
        ? E('section', 'rounded-lg border border-line bg-surface p-4',
          E('h3', 'eyebrow mb-2 text-xs font-bold uppercase text-ink3', '最も良かった1行'),
          E('p', 'mb-2 border-l-2 border-line pl-3 text-sm leading-snug text-ink2', fb.best.line),
          fb.best.reason ? E('p', 'text-xs text-ink3', fb.best.reason) : null)
        : null,

      (!isObj && fb)
        ? E('section', 'rounded-lg border border-line bg-surface p-4',
          E('h3', 'eyebrow mb-2 text-xs font-bold uppercase text-ink3', '講評（未整形）'),
          E('pre', 'whitespace-pre-wrap break-words font-sans text-sm leading-relaxed text-ink2', String(fb)))
        : null,

      (!fb && !p.scoring)
        ? E('section', 'rounded-lg border border-line bg-surface p-4 text-sm text-ink2',
          '採点は取得できませんでした。記録は保存されています。')
        : null,

      E('section', 'rounded-lg border border-line bg-surface p-4',
        E('h3', 'eyebrow mb-2 text-xs font-bold uppercase text-ink3', 'あなたの入力'),
        E('ol', 'flex flex-col gap-1.5',
          rec.inputs.length
            ? rec.inputs.map(function (l, i) {
              return E('li', { key: i, className: 'flex gap-2.5 text-sm leading-snug' },
                E('span', 'num w-5 shrink-0 pt-0.5 text-right text-xs text-ink3', i + 1),
                E('span', 'text-ink2', l));
            })
            : E('li', 'text-sm text-ink3', '（入力なし）'))),

      E('div', 'flex gap-2',
        p.nextMode
          ? E('button', {
            type: 'button', onClick: function () { p.startNext(p.nextMode); },
            className: 'flex flex-1 items-center justify-center gap-2 rounded-lg bg-accent px-4 py-3.5 text-sm font-bold text-onaccent',
          }, MODES[p.nextMode].mark + ' 次の種目へ', E(Icon, { name: 'right', size: 15, weight: 2.4 }))
          : null,
        E('button', {
          type: 'button', onClick: function () { p.go('home'); },
          className: (p.nextMode ? 'shrink-0 ' : 'flex-1 ')
            + 'flex items-center justify-center gap-2 rounded-lg border border-line bg-surface px-4 py-3.5 text-sm font-medium text-ink2',
        }, E(Icon, { name: 'home', size: 15 }), p.nextMode ? '' : 'ホームへ')));
  }

  /* ===================================================================
     履歴
     =================================================================== */
  function History(p) {
    var st = useState(null), open = st[0], setOpen = st[1];
    var dates = Object.keys(p.days).sort().reverse();

    var series = useMemo(function () {
      return dates.slice(0, 14).reverse().map(function (ds) {
        var row = { k: mdLabel(ds), m1: null, m2: null, m3: null };
        p.days[ds].items.forEach(function (r) {
          if (typeof r.score === 'number') row['m' + r.mode] = r.score;
        });
        return row;
      });
    }, [p.days]);

    var counts = useMemo(function () {
      return dates.slice(0, 14).reverse().map(function (ds) {
        var xs = p.days[ds].items.filter(function (r) { return r.mode === 1; });
        var v = xs.length ? Math.round((xs.reduce(function (a, r) { return a + r.count; }, 0) / xs.length) * 10) / 10 : null;
        return { k: mdLabel(ds), v: v };
      }).filter(function (r) { return r.v !== null; });
    }, [p.days]);

    return E('div', 'safe-page safe-t flex flex-col gap-4 px-4 pt-5',
      E('header', 'flex items-center gap-2',
        E('button', {
          type: 'button', onClick: function () { p.go('home'); },
          className: 'rounded-md border border-line p-1.5 text-ink2', 'aria-label': 'ホームへ戻る',
        }, E(Icon, { name: 'back', size: 16 })),
        E('h1', 'text-lg font-bold text-ink', '履歴'),
        E('span', 'num ml-auto text-xs text-ink3', dates.length + '日分')),

      E(ChartFrame, { title: '種目別スコア', note: '直近14日' }, E(ModeTrend, { data: series })),
      E(ChartFrame, { title: '① の平均本数', note: '10本満点' }, E(CountTrend, { data: counts })),

      dates.length === 0
        ? E('p', 'rounded-lg border border-dashed border-line px-4 py-8 text-center text-sm text-ink3',
          'まだ記録がありません。')
        : E('section', 'flex flex-col gap-2',
          dates.map(function (ds) {
            var day = p.days[ds];
            var isOpen = open === ds;
            var avg = (function () {
              var ss = day.items.map(function (r) { return r.score; }).filter(function (x) { return typeof x === 'number'; });
              return ss.length ? Math.round(ss.reduce(function (a, b) { return a + b; }, 0) / ss.length) : null;
            })();
            return E('div', { key: ds, className: 'overflow-hidden rounded-lg border border-line bg-surface' },
              E('button', {
                type: 'button', onClick: function () { setOpen(isOpen ? null : ds); },
                className: 'flex w-full items-center gap-3 px-4 py-3 text-left',
                'aria-expanded': isOpen ? 'true' : 'false',
              },
                E('span', 'num text-sm font-medium text-ink', ds),
                E('span', 'flex gap-1',
                  [1, 2, 3].map(function (m) {
                    var has = day.items.some(function (r) { return r.mode === m; });
                    return E('span', {
                      key: m, className: 'h-2 w-2 rounded-full ' + (has ? 'bg-accent' : 'border border-line'),
                    });
                  })),
                E('span', 'num ml-auto text-sm text-ink2', avg === null ? '—' : avg + '点'),
                E(Icon, { name: isOpen ? 'down' : 'right', size: 15, className: 'text-ink3' })),
              isOpen
                ? E('div', 'flex flex-col gap-4 border-t border-line2 px-4 py-4',
                  day.items.map(function (r) {
                    var M = MODES[r.mode];
                    return E('article', { key: r.id },
                      E('div', 'mb-1.5 flex items-baseline gap-2',
                        E('span', 'text-xs font-bold text-ink', M.mark + ' ' + M.short),
                        E('span', 'num text-xs text-ink3',
                          DIFF[r.difficulty || 0] + ' ・ ' + r.durationSec + '秒 ・ ' + r.count + (r.mode === 1 ? '本' : '項目')),
                        E('span', 'num ml-auto text-sm font-semibold text-ink', typeof r.score === 'number' ? r.score : '—')),
                      E('p', 'case mb-2 rounded-md bg-ground px-3 py-2 text-xs leading-relaxed text-ink2', r.prompt),
                      E('ol', 'flex flex-col gap-1',
                        r.inputs.map(function (l, i) {
                          return E('li', { key: i, className: 'flex gap-2 text-xs leading-snug' },
                            E('span', 'num w-4 shrink-0 text-right text-ink3', i + 1),
                            E('span', 'text-ink2', l));
                        })),
                      r.feedback && typeof r.feedback === 'object' && r.feedback.next
                        ? E('p', 'mt-2 border-l-2 border-accent pl-2.5 text-xs leading-snug text-ink2',
                          '次の1手: ' + r.feedback.next)
                        : null);
                  }))
                : null);
          })));
  }

  /* ===================================================================
     自分でお題を入力
     =================================================================== */
  function Custom(p) {
    var s1 = useState(1), mode = s1[0], setMode = s1[1];
    var s2 = useState(''), text = s2[0], setText = s2[1];
    var ok = text.trim().length >= 8;

    return E('div', 'safe-page safe-t flex flex-col gap-4 px-4 pt-5',
      E('header', 'flex items-center gap-2',
        E('button', {
          type: 'button', onClick: function () { p.go('home'); },
          className: 'rounded-md border border-line p-1.5 text-ink2', 'aria-label': 'ホームへ戻る',
        }, E(Icon, { name: 'back', size: 16 })),
        E('h1', 'text-lg font-bold text-ink', 'お題を自分で入力')),

      E('div', 'flex gap-2',
        [1, 2, 3].map(function (m) {
          return E('button', {
            key: m, type: 'button', onClick: function () { setMode(m); },
            className: 'flex-1 rounded-lg border px-2 py-2.5 text-xs font-medium '
              + (mode === m ? 'border-accent bg-accentsoft text-accent' : 'border-line bg-surface text-ink2'),
          }, MODES[m].mark + ' ' + MODES[m].short);
        })),

      E('p', 'text-xs text-ink3', MODES[mode].task),

      E('textarea', {
        id: 'custom-prompt', rows: 6, value: text,
        onChange: function (e) { setText(e.target.value); },
        placeholder: '実際に止まっている案件の状況を、数値込みで書く。\n例: 従業員○名の△業。月□万円で提案したが…',
        className: 'w-full resize-none rounded-lg border border-line bg-surface px-3 py-3 leading-relaxed text-ink outline-none focus:border-accent',
      }),

      E('button', {
        type: 'button', disabled: !ok,
        onClick: function () { p.startCustom(mode, text.trim()); },
        className: 'flex w-full items-center justify-center gap-2 rounded-lg px-4 py-3.5 text-sm font-bold '
          + (ok ? 'bg-accent text-onaccent' : 'border border-line bg-surface text-ink3'),
      }, E(Icon, { name: 'play', size: 15, weight: 2.4 }), 'この題で' + LIMIT_SEC + '秒'));
  }

  /* ===================================================================
     アプリ
     =================================================================== */
  function App() {
    var s1 = useState('home'), view = s1[0], setView = s1[1];
    var s2 = useState({}), days = s2[0], setDays = s2[1];
    var s3 = useState(null), run = s3[0], setRun = s3[1];
    var s4 = useState(null), result = s4[0], setResult = s4[1];
    var s5 = useState(false), scoring = s5[0], setScoring = s5[1];
    var s6 = useState(false), inSet = s6[0], setInSet = s6[1];
    var s7 = useState('記録はこの端末に保存中'), storageNote = s7[0], setStorageNote = s7[1];
    var s8 = useState(''), aiNote = s8[0], setAiNote = s8[1];

    var queue = useRef({ 1: null, 2: null, 3: null });
    var lastPrompt = useRef({ 1: null, 2: null, 3: null });
    var daysRef = useRef(days);
    daysRef.current = days;
    var today = todayStr();

    /* 起動時: 保存済みの記録を読み、同時にAPIでお題を仕込む */
    useEffect(function () {
      var alive = true;
      Store.loadAll().then(function (list) {
        if (!alive) return;
        var m = {};
        list.forEach(function (d) { if (d && d.date && Array.isArray(d.items)) m[d.date] = d; });
        setDays(m);
        setStorageNote(Store.isRemote() ? '記録はアカウントに同期中' : '記録はこの端末に保存中');
      });
      AI.genPrompts().then(function (out) {
        if (!alive) return;
        if (out) queue.current = Object.assign({}, queue.current, out);
        setAiNote(AI.isLive() ? 'AI採点あり' : 'AI採点なし・お題は内蔵60問');
      });
      return function () { alive = false; };
    }, []);

    var streak = useMemo(function () {
      var cur = today;
      if (!days[cur] || !days[cur].items.length) {
        cur = shiftDay(today, -1);
        if (!days[cur] || !days[cur].items.length) return 0;
      }
      var n = 0;
      while (days[cur] && days[cur].items.length) { n++; cur = shiftDay(cur, -1); }
      return n;
    }, [days, today]);

    function refill() {
      AI.genPrompts().then(function (out) {
        if (!out) return;
        Object.keys(out).forEach(function (k) { if (!queue.current[k]) queue.current[k] = out[k]; });
      });
    }

    function takePrompt(mode) {
      var chosen = queue.current[mode];
      if (chosen) {
        queue.current[mode] = null;
      } else {
        var item = pick(POOL[mode]);
        if (item.t === lastPrompt.current[mode]) item = pick(POOL[mode]);  /* 直前と同じ題は引き直す */
        chosen = { t: item.t, d: item.d, dom: null, src: 'pool', ask: item.ask };
      }
      lastPrompt.current[mode] = chosen.t;
      refill();   /* 次に使うぶんを裏で仕込む */
      return chosen;
    }

    function begin(mode, promptObj, asSet) {
      setResult(null);
      setInSet(!!asSet);
      setRun({
        id: uid(), mode: mode, prompt: promptObj.t, difficulty: promptObj.d,
        domain: promptObj.dom, source: promptObj.src, ask: promptObj.ask,
        startedAt: Date.now(),
      });
      setView('run');
    }

    var startSet = useCallback(function (mode) { begin(mode, takePrompt(mode), true); }, []);
    var startCustom = useCallback(function (mode, text) {
      begin(mode, { t: text, d: 0, dom: null, src: 'custom' }, false);
    }, []);

    /* 記録は先に保存し、採点はあとから追いつかせる */
    var onFinish = useCallback(function (out) {
      var rec = {
        id: run.id, date: today, mode: run.mode, prompt: run.prompt,
        difficulty: run.difficulty, domain: run.domain, source: run.source,
        ask: run.ask || null,
        inputs: out.inputs, durationSec: out.durationSec, count: out.inputs.length,
        score: null, feedback: null, createdAt: new Date().toISOString(),
      };

      var nextDays = Object.assign({}, daysRef.current);
      var day = nextDays[today] ? { date: today, items: nextDays[today].items.slice() } : { date: today, items: [] };
      day.items = day.items.filter(function (r) { return r.mode !== rec.mode; }).concat([rec]);
      day.items.sort(function (a, b) { return a.mode - b.mode; });
      day.updatedAt = new Date().toISOString();
      nextDays[today] = day;
      daysRef.current = nextDays;
      setDays(nextDays);
      setResult(rec);
      setRun(null);
      setView('result');

      Store.saveDay(day);
      persistSummary(nextDays);

      if (!rec.inputs.length) return;   /* 白紙は採点しない */

      setScoring(true);
      AI.score(rec).then(function (r) {
        setScoring(false);
        var fb = r.ok ? r.fb : (r.raw || null);
        var score = r.ok ? r.fb.score : null;
        var updated = Object.assign({}, rec, { score: score, feedback: fb });
        setResult(updated);

        var prev = daysRef.current;
        var nd = Object.assign({}, prev);
        var d = nd[today] ? { date: today, items: nd[today].items.slice() } : { date: today, items: [] };
        d.items = d.items.map(function (x) { return x.id === rec.id ? updated : x; });
        d.updatedAt = new Date().toISOString();
        nd[today] = d;
        daysRef.current = nd;
        setDays(nd);
        Store.saveDay(d);
        persistSummary(nd);
      }).catch(function () { setScoring(false); });
    }, [run, today]);

    function persistSummary(map) {
      try {
        var dates = Object.keys(map).sort();
        var total = 0, sum = 0, n = 0, byMode = { 1: 0, 2: 0, 3: 0 };
        dates.forEach(function (ds) {
          map[ds].items.forEach(function (r) {
            total++; byMode[r.mode] = (byMode[r.mode] || 0) + 1;
            if (typeof r.score === 'number') { sum += r.score; n++; }
          });
        });
        var cur = todayStr();
        if (!map[cur] || !map[cur].items.length) cur = shiftDay(cur, -1);
        var st = 0;
        while (map[cur] && map[cur].items.length) { st++; cur = shiftDay(cur, -1); }
        Store.saveSummary({
          streak: st, days: dates.length, totalSessions: total, byMode: byMode,
          avgScore: n ? Math.round(sum / n) : null,
          lastDate: dates.length ? dates[dates.length - 1] : null,
          updatedAt: new Date().toISOString(),
        });
      } catch (e) { /* 集計に失敗しても本体は動かす */ }
    }

    var nextMode = useMemo(function () {
      if (!inSet || !result) return null;
      var done = {};
      (days[today] ? days[today].items : []).forEach(function (r) { done[r.mode] = true; });
      var m;
      for (m = result.mode + 1; m <= 3; m++) if (!done[m]) return m;   /* 残りを順に */
      for (m = 1; m < result.mode; m++) if (!done[m]) return m;        /* 飛ばした分を拾う */
      return result.mode < 3 ? result.mode + 1 : null;                 /* 2周目 */
    }, [inSet, result, days, today]);

    var go = useCallback(function (v) { setView(v); }, []);

    if (view === 'run' && run) {
      return E(Stage, { run: run, onFinish: onFinish });
    }

    var inner;
    if (view === 'result' && result) {
      inner = E(Result, {
        rec: result, scoring: scoring, nextMode: nextMode, go: go,
        startNext: function (m) { startSet(m); },
      });
    } else if (view === 'history') {
      inner = E(History, { days: days, go: go });
    } else if (view === 'custom') {
      inner = E(Custom, { go: go, startCustom: startCustom });
    } else {
      inner = E(Home, {
        days: days, today: today, streak: streak, go: go,
        startSet: startSet, storageNote: storageNote, aiNote: aiNote,
      });
    }
    return E('div', 'mx-auto w-full max-w-xl', inner);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(E(App));
})();
</script>

<script>
  /* ホーム画面から起動したときも、圏外のときも立ち上がるようにする。
     file:// で開いた場合や登録できない環境では黙って何もしない。 */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
